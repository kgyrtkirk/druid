version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    # Weekly batches avoid PRs superseded by the next release a few days later; each PR runs full CI
    # on the PR and again on master after merge. Security updates are not bound by this schedule.
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "22:00"
    open-pull-requests-limit: 20
    # Set explicitly; otherwise Dependabot infers the prefix from recent commits (e.g. "ci:")
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      # Protect against not-yet-discovered regressions or security issues in new releases of dependencies
      # https://github.blog/changelog/2025-07-01-dependabot-supports-configuration-of-a-minimum-package-age/
      default-days: 14
    # A dependency joins the first group it matches, so the catch-all "patch" group must stay last.
    # Minor and major updates outside the family groups still get individual PRs.
    groups:
      # The individual org.apache.maven.resolver:* artifacts must move together: they are all
      # pinned to the same version in services/pom.xml and server/pom.xml, and a 1.x -> 2.x major
      # bump also requires coordinated source/bootstrap changes in PullDependencies (see the
      # 2.0.23 upgrade PR). A single-artifact bump breaks the build with a mixed 1.x/2.x graph.
      maven-resolver:
        patterns:
          - "org.apache.maven.resolver:*"
      # Google Cloud client libraries release together
      google-cloud:
        patterns:
          - "com.google.cloud:*"
          - "com.google.api:*"
          - "com.google.api.grpc:*"
          - "com.google.auth:*"
        update-types: ["minor", "patch"]
      grpc:
        patterns:
          - "io.grpc:*"
        update-types: ["minor", "patch"]
      # Build-time only; not shipped in the distribution
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "com.github.spotbugs:spotbugs-maven-plugin"
          - "io.github.ascopes:protobuf-maven-plugin"
          - "io.github.git-commit-id:git-commit-id-maven-plugin"
          - "de.thetaphi:forbiddenapis"
          - "org.apache.maven.extensions:*"
          - "org.apache.rat:apache-rat-plugin"
          - "org.jacoco:*"
          - "org.cyclonedx:cyclonedx-maven-plugin"
          - "org.owasp:dependency-check-maven"
          - "net.nicoulaj.maven.plugins:checksum-maven-plugin"
          - "kr.motd.maven:os-maven-plugin"
          - "com.github.eirslett:frontend-maven-plugin"
          - "org.openrewrite.maven:*"
          - "org.openrewrite.recipe:*"
        update-types: ["minor", "patch"]
      # Test scope only; not shipped in the distribution (e.g. #20216, #20217, #20219 opened the same day)
      test-libs:
        patterns:
          - "org.junit:*"
          - "junit:junit"
          - "org.mockito:*"
          - "net.bytebuddy:*"
          - "org.objenesis:*"
          - "org.easymock:*"
          - "nl.jqno.equalsverifier:*"
          - "org.assertj:*"
          - "com.github.fppt:jedis-mock"
        update-types: ["minor", "patch"]
      # AWS SDK and the Kinesis client release together (e.g. #20531 and #20533 opened the same day)
      aws:
        patterns:
          - "software.amazon.awssdk:*"
          - "software.amazon.kinesis:*"
        update-types: ["minor", "patch"]
      opentelemetry:
        patterns:
          - "io.opentelemetry:*"
          - "io.opentelemetry.instrumentation:*"
        update-types: ["minor", "patch"]
      # bcprov and bcpkix share a version (#20081 and #20078 were split)
      bouncycastle:
        patterns:
          - "org.bouncycastle:*"
        update-types: ["minor", "patch"]
      # woodstox-core depends on stax2-api (#20582 and #20585 were split)
      woodstox:
        patterns:
          - "com.fasterxml.woodstox:*"
          - "org.codehaus.woodstox:*"
        update-types: ["minor", "patch"]
      # okio and okio-jvm are the same release (#20280 and #20288 were split)
      square:
        patterns:
          - "com.squareup.okio:*"
          - "com.squareup.okhttp3:*"
        update-types: ["minor", "patch"]
      apache-commons:
        patterns:
          - "org.apache.commons:*"
          - "commons-*:*"
        update-types: ["minor", "patch"]
      patch:
        patterns:
          - "*"
        update-types: ["patch"]
    # Every ignore rule must have a comment stating why it is ignored, with a pointer (PR, issue or
    # comment link) to the discussion behind it, so it can be re-evaluated and removed later.
    # Keep every ignore rule here. "@dependabot ignore" comments are stored by Dependabot outside the
    # repo and are hard to find; use this file and "@dependabot unignore" instead.
    # Rules with update-types only skip version updates; rules with versions also skip security updates.
    ignore:
      # skip AWS SDK v2 patch releases, which ship almost daily; minor bumps still come through
      # https://github.com/apache/druid/pull/20591
      - dependency-name: "software.amazon.awssdk:*"
        update-types: ["version-update:semver-patch"]
      # zstd-jni 1.5.7-13 and later cannot decode legacy (pre-1.0) zstd frames in .zst batch input.
      # Version updates are ignored; security updates still open PRs.
      # Remove once legacy frame support is dropped (planned for Druid 40).
      # https://github.com/apache/druid/pull/20398#issuecomment-5771448043
      # https://github.com/apache/druid/pull/20536#issuecomment-6072384746
      - dependency-name: "com.github.luben:zstd-jni"
      # Major upgrades of the following dependencies need code or build changes, so they are done by hand.
      # Dependabot still proposes their minor and patch updates.
      # Vert.x must match the Fabric8 kubernetes-httpclient-vertx client; Vert.x 5 needs kubernetes-httpclient-vertx-5
      # https://github.com/apache/druid/pull/20262#issuecomment-5549339724
      - dependency-name: "io.vertx:*"
        update-types: ["version-update:semver-major"]
      # pac4j 6 breaks source compatibility and changes profile/session serialization
      # https://github.com/apache/druid/pull/19936
      # https://github.com/apache/druid/pull/20275
      - dependency-name: "org.pac4j:*"
        update-types: ["version-update:semver-major"]
      # javacc-maven-plugin 3 generates a Druid SQL parser that does not compile
      # https://github.com/apache/druid/pull/20033#issuecomment-5322992971
      - dependency-name: "org.codehaus.mojo:javacc-maven-plugin"
        update-types: ["version-update:semver-major"]
      # Guice 7 requires migrating from javax to jakarta packages
      # https://github.com/apache/druid/pull/19799
      - dependency-name: "com.google.inject:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.inject.extensions:*"
        update-types: ["version-update:semver-major"]

  # website and web-console share one entry so a group spans both directories in a single PR
  - package-ecosystem: "npm"
    directories:
      - "/website/"
      - "/web-console/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "22:00"
    groups:
      # Version updates are all ignored below; this groups the remaining security updates
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Every ignore rule must have a comment stating why it is ignored, with a pointer to the discussion.
    ignore:
      # Version update PRs were noise; the web-console maintainers asked to stop them
      # https://github.com/apache/druid/issues/18137
      # https://github.com/apache/druid/pull/18157
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
